<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra - Fashion Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">MYNTRA<span>.</span></div>
        

        <nav class="nav-links">
            <a href="#men">MEN</a>
            <a href="#women">WOMEN</a>
            <a href="#kids">KIDS</a>
            <a href="#home">HOME</a>
            <a href="#beauty">BEAUTY</a>
        </nav>

        <div class="search-box">
            <span>⌕</span>
            <input type="text" id="searchInput"
                placeholder="Search for products, brands and more">

        <div class="nav-actions">
            <div class="nav-item">
                <span>♙</span>
                <small>Profile</small>
            </div>
            <div class="nav-item">
                <span>♡</span>
                <small>Wishlist</small>
            </div>
            <div class="nav-item bag-item" id="bagButton">
                <span>🛍</span>
                <small>Bag</small>
                <b id="bagCount">0</b>
            </div>
        </div>
    </header>
